version: "3.9"

services:

  # ── PostgreSQL (CARMADB) ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: carma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       CARMADB
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: pranto121
    volumes:
      - carma_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres -d CARMADB"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis (Celery broker + Channels + Cache) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: carma_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - carma_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Qdrant (Vector DB for CAR retriever) ─────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: carma_qdrant
    restart: unless-stopped
    volumes:
      - carma_qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ── Django + Daphne (HTTP + WebSocket) ───────────────────────
  api:
    build:
      context:    ./carma-backend
      dockerfile: Dockerfile
    container_name: carma_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./carma-backend:/app
      - carma_media:/app/media
      - carma_static:/app/staticfiles
      - carma_logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - ./carma-backend/.env
    environment:
      DB_HOST:    db
      REDIS_URL:  redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout:  10s
      retries:  5

  # ── Celery Worker ─────────────────────────────────────────────
  celery_worker:
    build:
      context:    ./carma-backend
      dockerfile: Dockerfile
    container_name: carma_celery_worker
    restart: unless-stopped
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=4
      --queues=default,experiments
      --max-tasks-per-child=50
    volumes:
      - ./carma-backend:/app
      - carma_logs:/app/logs
    env_file:
      - ./carma-backend/.env
    environment:
      DB_HOST:    db
      REDIS_URL:  redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (scheduled tasks) ────────────────────────────
  celery_beat:
    build:
      context:    ./carma-backend
      dockerfile: Dockerfile
    container_name: carma_celery_beat
    restart: unless-stopped
    command: >
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./carma-backend:/app
    env_file:
      - ./carma-backend/.env
    environment:
      DB_HOST:   db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  # ── React Frontend (Vite dev) ─────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: carma_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./carma-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  carma_postgres_data:
  carma_redis_data:
  carma_qdrant_data:
  carma_media:
  carma_static:
  carma_logs:
